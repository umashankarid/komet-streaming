<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet Overlay</title>
    <style>
      /* Transparent background for OBS Browser Source. */
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #fff;
        overflow: hidden;
      }
      .scoreboard {
        position: absolute;
        bottom: 48px;
        left: 48px;
        min-width: 520px;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        opacity: 0;
        transform: translateY(12px);
        transition: opacity 0.4s ease, transform 0.4s ease;
      }
      .scoreboard.show {
        opacity: 1;
        transform: translateY(0);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 0;
        background: rgba(11, 22, 40, 0.92);
      }
      .row.home {
        border-left: 6px solid #ffd200;
      }
      .row.away {
        border-left: 6px solid #00b3ff;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      .name {
        padding: 12px 18px;
        font-size: 24px;
        font-weight: 600;
        white-space: nowrap;
      }
      .games {
        padding: 12px 16px;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        color: #ffd200;
        background: rgba(0, 0, 0, 0.25);
      }
      .points {
        padding: 12px 22px;
        font-size: 30px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: rgba(255, 255, 255, 0.08);
        min-width: 34px;
        text-align: center;
      }
      .winner {
        outline: 2px solid #37d67a;
      }
      .header {
        background: rgba(0, 0, 0, 0.55);
        padding: 6px 18px;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #9fb3c8;
      }
      .banner {
        background: #ffd200;
        color: #06210f;
        padding: 5px 18px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: none;
      }
      .banner.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="board" class="scoreboard">
      <div class="banner" id="banner"></div>
      <div class="header" id="court-label">Court</div>
      <div class="row home">
        <div class="name" id="home-name">—</div>
        <div class="games" id="home-games">0</div>
        <div class="points" id="home-points">0</div>
      </div>
      <div class="row away">
        <div class="name" id="away-name">—</div>
        <div class="games" id="away-games">0</div>
        <div class="points" id="away-points">0</div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const courtId = Number(location.pathname.split("/").pop()) || 1;
      const $ = (id) => document.getElementById(id);
      const teamName = (t) =>
        (t?.players || []).map((p) => p.name).join(" / ") || "—";

      function render(snap) {
        const board = $("board");
        if (!snap) {
          board.classList.remove("show");
          return;
        }
        $("court-label").textContent =
          (snap.courtName || "Court " + snap.courtId) +
          " · " +
          snap.status.toUpperCase();
        const bannerEl = $("banner");
        if (snap.banner) {
          bannerEl.textContent = snap.banner;
          bannerEl.classList.add("show");
        } else {
          bannerEl.classList.remove("show");
        }
        $("home-name").textContent = teamName(snap.home);
        $("away-name").textContent = teamName(snap.away);
        $("home-games").textContent = snap.gamesWon.home;
        $("away-games").textContent = snap.gamesWon.away;
        $("home-points").textContent = snap.currentGame.home;
        $("away-points").textContent = snap.currentGame.away;
        $("home-points").classList.toggle(
          "winner",
          snap.matchWinner === "home",
        );
        $("away-points").classList.toggle(
          "winner",
          snap.matchWinner === "away",
        );
        board.classList.add("show");
      }

      // Initial state via REST, then live updates via Socket.IO.
      fetch("/api/courts/" + courtId + "/match")
        .then((r) => (r.ok ? r.json() : null))
        .then(render)
        .catch(() => {});

      const socket = io();
      socket.on("connect", () => socket.emit("join-court", courtId));
      socket.on("court:update", render);
    </script>
  </body>
</html>
