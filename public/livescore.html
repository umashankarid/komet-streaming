<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Komet Scorer</title>
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; height: 100%;
        background: #06101f; color: #fff;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        overflow: hidden;
      }
      .top {
        text-align: center; padding: 10px;
        border-bottom: 1px solid #21344f;
      }
      .court { color: #9fb3c8; letter-spacing: 2px; text-transform: uppercase; font-size: 14px; }
      .games { font-size: 15px; color: #ffd200; margin-top: 2px; }
      .status { font-size: 12px; color: #6b7f96; margin-top: 2px; }
      .sides { display: flex; height: calc(100% - 66px); }
      .side {
        flex: 1; display: flex; flex-direction: column;
        align-items: center; justify-content: space-between;
        padding: 14px 8px;
      }
      .side.home { background: #17233a; }
      .side.away { background: #142033; }
      .swatch { height: 6px; width: 60%; border-radius: 3px; }
      .home .swatch { background: #ffd200; }
      .away .swatch { background: #00b3ff; }
      .name { font-size: 18px; font-weight: 700; text-align: center; margin-top: 6px; min-height: 44px; }
      .pts { font-size: 96px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
      .btns { display: flex; flex-direction: column; gap: 10px; width: 100%; }
      button {
        border: none; border-radius: 12px; padding: 22px 0;
        font-size: 30px; font-weight: 800; cursor: pointer;
      }
      .plus { background: #37d67a; color: #06210f; }
      .minus { background: #33475f; color: #cfe0f2; font-size: 22px; padding: 14px 0; }
      button:active { transform: scale(0.97); }
      .msg {
        position: fixed; inset: 0; display: none;
        align-items: center; justify-content: center;
        background: rgba(6,16,31,0.96); text-align: center; padding: 24px;
        font-size: 18px; color: #ff9a9a;
      }
      .msg.show { display: flex; }
    </style>
  </head>
  <body>
    <div class="top">
      <div class="court" id="court">Court</div>
      <div class="games" id="games">—</div>
      <div class="status" id="status">connecting…</div>
    </div>

    <div class="sides">
      <div class="side home">
        <span class="swatch"></span>
        <div class="name" id="home-name">Home</div>
        <div class="pts" id="home-pts">0</div>
        <div class="btns">
          <button class="plus" data-side="home" data-op="point">+1</button>
          <button class="minus" data-side="home" data-op="correct">−1</button>
        </div>
      </div>
      <div class="side away">
        <span class="swatch"></span>
        <div class="name" id="away-name">Away</div>
        <div class="pts" id="away-pts">0</div>
        <div class="btns">
          <button class="plus" data-side="away" data-op="point">+1</button>
          <button class="minus" data-side="away" data-op="correct">−1</button>
        </div>
      </div>
    </div>

    <div class="msg" id="msg"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // URL like /score-link/court1 -> courtId 1
      const m = location.pathname.match(/court(\d+)/i);
      const courtId = m ? Number(m[1]) : 1;
      const $ = (id) => document.getElementById(id);
      const teamName = (t) => (t?.players || []).map((p) => p.name).join(" / ") || "—";
      let active = false;

      function show(msg) { $("msg").textContent = msg; $("msg").classList.add("show"); }
      function hide() { $("msg").classList.remove("show"); }

      function renderMatch(snap) {
        $("court").textContent = "Court " + courtId;
        if (!snap) {
          $("home-pts").textContent = "0";
          $("away-pts").textContent = "0";
          $("games").textContent = "—";
          $("home-name").textContent = "Home";
          $("away-name").textContent = "Away";
          return;
        }
        $("home-name").textContent = teamName(snap.home);
        $("away-name").textContent = teamName(snap.away);
        $("home-pts").textContent = snap.currentGame.home;
        $("away-pts").textContent = snap.currentGame.away;
        $("games").textContent = "Games " + snap.gamesWon.home + " – " + snap.gamesWon.away;
        $("status").textContent = snap.matchWinner
          ? "Match won by " + (snap.matchWinner === "home" ? teamName(snap.home) : teamName(snap.away))
          : snap.status.toUpperCase();
      }

      function applyActive() {
        // Disable +/- buttons when scoring is not active.
        document.querySelectorAll("button").forEach((b) => (b.disabled = !active));
        if (!active) {
          show("Waiting for the control desk to start the match on Court " + courtId + ".");
        } else {
          hide();
        }
      }

      async function loadState() {
        try {
          const res = await fetch("/score-link/court" + courtId + "/state");
          const data = await res.json();
          active = Boolean(data.active);
          renderMatch(data.match);
          applyActive();
        } catch (_e) { $("status").textContent = "offline"; }
      }

      async function act(op, side) {
        if (!active) return;
        try {
          const res = await fetch("/score-link/court" + courtId + "/" + op, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ side }),
          });
          if (res.status === 409) {
            active = false; applyActive(); return; // became inactive
          }
          if (!res.ok) {
            const e = await res.json().catch(() => ({}));
            $("status").textContent = e.error || "error";
            loadState();
            return;
          }
          renderMatch(await res.json());
        } catch (_e) { $("status").textContent = "offline"; }
      }

      document.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b || b.disabled) return;
        act(b.dataset.op, b.dataset.side);
      });

      // Live updates: match changes and start/clear flip active state.
      const socket = io();
      socket.on("connect", () => socket.emit("join-court", courtId));
      socket.on("court:update", (snap) => {
        active = Boolean(snap && snap.status === "live");
        renderMatch(snap);
        applyActive();
      });
      socket.on("court:cleared", () => {
        active = false;
        renderMatch(null);
        applyActive();
      });

      loadState();
    </script>
  </body>
</html>
