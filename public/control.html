<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet Control</title>
    <style>
      :root {
        --bg: #0b1628;
        --panel: #13233d;
        --line: #21344f;
        --home: #ffd200;
        --away: #00b3ff;
        --ok: #37d67a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: #e8eef6;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 12px;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 1px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 16px;
        padding: 24px;
      }
      .court {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 16px;
      }
      .court h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .status {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #9fb3c8;
        margin-bottom: 12px;
      }
      .side {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 0;
      }
      .side .label {
        font-weight: 600;
      }
      .side.home .swatch {
        background: var(--home);
      }
      .side.away .swatch {
        background: var(--away);
      }
      .swatch {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 8px;
      }
      .pts {
        font-size: 26px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        min-width: 42px;
        text-align: center;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      button {
        cursor: pointer;
        border: 1px solid var(--line);
        background: #1c3358;
        color: #fff;
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 14px;
      }
      button:hover {
        border-color: #3a5c8f;
      }
      button.primary {
        background: var(--ok);
        color: #06210f;
        border-color: transparent;
        font-weight: 700;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
        flex-wrap: wrap;
      }
      .setup {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }
      .setup input {
        background: #0d1b31;
        border: 1px solid var(--line);
        color: #fff;
        border-radius: 6px;
        padding: 8px;
      }
      a.link {
        color: #7fc0ff;
        font-size: 12px;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>BMK KOMET — CONTROL</h1>
      <span id="conn" class="status">connecting…</span>
      <span style="flex:1"></span>
      <a class="link" href="/">Dashboard</a>
      <form method="POST" action="/logout" style="display:inline;margin-left:12px">
        <button type="submit">Sign out</button>
      </form>
    </header>
    <div id="grid" class="grid"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const state = new Map(); // courtId -> snapshot
      const streaming = new Map(); // courtId -> streaming snapshot
      const teamName = (t) =>
        (t?.players || []).map((p) => p.name).join(" / ") || "—";

      // Format elapsed ms as H:MM:SS or M:SS.
      function fmtDuration(ms) {
        const s = Math.floor(ms / 1000);
        const hh = Math.floor(s / 3600);
        const mm = Math.floor((s % 3600) / 60);
        const ss = s % 60;
        const p = (n) => String(n).padStart(2, "0");
        return hh > 0 ? hh + ":" + p(mm) + ":" + p(ss) : mm + ":" + p(ss);
      }

      async function api(path, body) {
        const res = await fetch("/api" + path, {
          method: body ? "POST" : "GET",
          headers: { "Content-Type": "application/json" },
          body: body ? JSON.stringify(body) : undefined,
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          alert(e.error || res.statusText);
          throw new Error(e.error || res.statusText);
        }
        return res.json();
      }

      async function loadCourts() {
        const courts = await api("/courts");
        const ids = new Set(courts.map((c) => c.id));
        for (let i = 1; i <= 4; i++) ids.add(i);
        [...ids]
          .sort((a, b) => a - b)
          .forEach((id) => {
            const c = courts.find((x) => x.id === id);
            if (c?.match) state.set(id, c.match);
            if (c?.streaming) streaming.set(id, c.streaming);
            renderCourt(id);
            renderStreaming(id);
            socket.emit("join-court", id);
          });
      }

      function el(html) {
        const t = document.createElement("template");
        t.innerHTML = html.trim();
        return t.content.firstChild;
      }

      function renderCourt(courtId) {
        const snap = state.get(courtId);
        const existing = document.getElementById("court-" + courtId);
        const node = existing || el('<div class="court" id="court-' + courtId + '"></div>');

        if (!snap) {
          node.innerHTML =
            "<h2>Court " + courtId + "</h2>" +
            '<div class="status">no match</div>' +
            '<div class="setup">' +
            '<input id="name-' + courtId + '" placeholder="Court name (optional, e.g. Center Court)" />' +
            '<input id="banner-' + courtId + '" placeholder="Banner (optional, e.g. Semi Final)" />' +
            '<input id="h-' + courtId + '" placeholder="Home player(s)" />' +
            '<input id="a-' + courtId + '" placeholder="Away player(s)" />' +
            '<input id="pts-' + courtId + '" type="number" min="1" value="15" placeholder="Points to win" />' +
            '<input id="bo-' + courtId + '" type="number" min="1" step="2" value="3" placeholder="Best of (odd)" />' +
            "</div>" +
            '<div class="actions"><button class="primary" data-create="' +
            courtId + '">Create match</button></div>';
        } else {
          node.innerHTML =
            "<h2>" + (snap.courtName || "Court " + courtId) +
            ' <a class="link" href="/overlay/court/' + courtId +
            '" target="_blank">overlay</a> ' +
            '<a class="link" href="/overlay/court/' + courtId +
            '/ticker" target="_blank">ticker</a> ' +
            '<a class="link" href="/score/' + courtId +
            '" target="_blank">score</a></h2>' +
            '<div class="status">' + snap.status +
            (snap.banner ? " · " + snap.banner : "") +
            " · games " + snap.gamesWon.home + "–" + snap.gamesWon.away +
            ' · <span class="timer" data-timer="' + courtId + '">0:00</span>' +
            (snap.matchWinner ? " · winner: " + snap.matchWinner : "") +
            "</div>" +
            sideRow(courtId, "home", snap) +
            sideRow(courtId, "away", snap) +
            '<div class="setup" style="margin-top:12px">' +
            '<input id="ticker-' + courtId + '" placeholder="Scrolling ticker text" value="' +
            (snap.tickerText ? String(snap.tickerText).replace(/"/g, "&quot;") : "") + '" />' +
            "</div>" +
            '<div class="actions">' +
            (snap.status === "scheduled"
              ? '<button class="primary" data-start="' + courtId + '">Start</button>'
              : "") +
            (snap.status === "live"
              ? '<button data-next="' + courtId + '">Next game</button>'
              : "") +
            '<button data-ticker="' + courtId + '">Update ticker</button>' +
            "</div>";
        }
        if (!existing) document.getElementById("grid").appendChild(node);
        // renderCourt rewrites innerHTML, so (re)attach the streaming section
        // and repaint it from the last known streaming snapshot.
        let sc = node.querySelector(".streaming");
        if (!sc) {
          sc = el('<div class="streaming" id="streaming-' + courtId + '"></div>');
          node.appendChild(sc);
        }
        renderStreaming(courtId);
      }

      // --- Streaming section per court -----------------------------------
      const OVERLAY_LABELS = [
        ["score", "Match + Score"],
        ["match", "Match info only"],
        ["full", "Sponsor/tournament banner"],
        ["none", "None (clean recording)"],
      ];

      function streamStatusDot(s) {
        if (s === "live") return "🔴 LIVE";
        if (s === "starting") return "🟡 starting…";
        if (s === "stopping") return "🟡 stopping…";
        if (s === "error") return "⚠️ error";
        return "⚪ Not live";
      }

      function renderStreaming(courtId) {
        const sc = document.querySelector("#streaming-" + courtId);
        if (!sc) return;
        const st = streaming.get(courtId) || {
          youtubeStatus: "idle",
          overlayMode: "score",
          cameraConnected: false,
        };
        const live = st.youtubeStatus === "live";
        const busy = st.youtubeStatus === "starting" || st.youtubeStatus === "stopping";
        const cam = st.cameraConnected ? "🟢 SRT connected" : "⚪ No camera";
        // Preserve the operator's in-progress title edit across re-renders.
        const existingInput = sc.querySelector(".yt-title");
        const titleVal =
          existingInput && document.activeElement === existingInput
            ? existingInput.value
            : (st.title || "");

        let html =
          '<hr style="border-color:#21344f;margin:14px 0" />' +
          '<div class="status">STREAMING · Camera: ' + cam +
          " · YouTube: " + streamStatusDot(st.youtubeStatus) +
          (live && st.startedAt
            ? ' · <span class="timer" data-stream-timer="' + courtId + '">0:00</span>'
            : "") +
          (st.error ? ' · <span style="color:#ff7a7a">' + escapeHtml(st.error) + "</span>" : "") +
          "</div>";

        if (!live && !busy) {
          html +=
            '<div class="setup">' +
            '<input class="yt-title" id="yt-' + courtId + '" placeholder="YouTube title" value="' +
            escapeAttr(titleVal) + '" />' +
            '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:13px">' +
            OVERLAY_LABELS.map(function (m) {
              const checked = (st.overlayMode || "score") === m[0] ? " checked" : "";
              return (
                '<label style="display:flex;align-items:center;gap:4px">' +
                '<input type="radio" name="ov-' + courtId + '" value="' + m[0] + '"' + checked + " />" +
                m[1] + "</label>"
              );
            }).join("") +
            "</div></div>" +
            '<div class="actions">' +
            '<button class="primary" data-suggest="' + courtId + '">Auto title</button>' +
            '<button class="primary" data-stream-start="' + courtId +
            '" style="background:#ff4d4d;color:#fff">🔴 START STREAM</button>' +
            (st.youtubeStatus === "error"
              ? '<button data-stream-reset="' + courtId + '">Reset</button>'
              : "") +
            "</div>";
        } else {
          html +=
            '<div class="setup"><div style="font-size:14px">' +
            "Title: " + escapeHtml(st.title || "—") +
            "<br/>Overlay: " + (st.overlayMode || "score") + "</div></div>" +
            '<div class="actions">' +
            (live
              ? '<button data-stream-stop="' + courtId + '">⏹ STOP STREAM</button>'
              : '<button disabled>' + streamStatusDot(st.youtubeStatus) + "</button>") +
            "</div>";
        }
        sc.innerHTML = html;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function escapeAttr(s) {
        return escapeHtml(s).replace(/"/g, "&quot;");
      }

      function sideRow(courtId, side, snap) {
        return (
          '<div class="side ' + side + '">' +
          '<span class="label"><span class="swatch"></span>' +
          teamName(snap[side]) + "</span>" +
          '<span class="pts">' + snap.currentGame[side] + "</span>" +
          '<span class="controls">' +
          '<button data-point="' + courtId + '" data-side="' + side + '">+1</button>' +
          '<button data-correct="' + courtId + '" data-side="' + side + '">−1</button>' +
          "</span></div>"
        );
      }

      // Live duration timer: tick every second using the snapshot's
      // startedAt/durationMs so it stays correct across reconnects.
      setInterval(() => {
        document.querySelectorAll("[data-timer]").forEach((elm) => {
          const snap = state.get(Number(elm.dataset.timer));
          if (!snap) return;
          let ms = snap.durationMs || 0;
          // While live, extend the last-known duration by wall-clock drift.
          if (snap.status === "live" && snap.startedAt) {
            ms = Date.now() - snap.startedAt;
          }
          elm.textContent = fmtDuration(ms);
        });
        // Stream duration timers.
        document.querySelectorAll("[data-stream-timer]").forEach((elm) => {
          const st = streaming.get(Number(elm.dataset.streamTimer));
          if (!st || st.youtubeStatus !== "live" || !st.startedAt) return;
          elm.textContent = fmtDuration(Date.now() - st.startedAt);
        });
      }, 1000);

      document.addEventListener("click", async (e) => {
        const t = e.target;
        if (t.dataset.create) {
          const id = Number(t.dataset.create);
          const g = (p) => document.getElementById(p + id).value.trim();
          await api("/courts/" + id + "/match", {
            courtName: g("name-") || undefined,
            banner: g("banner-") || undefined,
            home: { players: [{ name: g("h-") || "Home" }] },
            away: { players: [{ name: g("a-") || "Away" }] },
            scoring: {
              pointsToWin: Number(g("pts-")) || 15,
              bestOf: Number(g("bo-")) || 3,
            },
          });
        } else if (t.dataset.start) {
          await api("/courts/" + t.dataset.start + "/match/start", {});
        } else if (t.dataset.point) {
          await api("/courts/" + t.dataset.point + "/match/point", {
            side: t.dataset.side,
          });
        } else if (t.dataset.correct) {
          await api("/courts/" + t.dataset.correct + "/match/correct", {
            side: t.dataset.side,
          });
        } else if (t.dataset.next) {
          await api("/courts/" + t.dataset.next + "/match/next-game", {});
        } else if (t.dataset.ticker) {
          const id = t.dataset.ticker;
          const text = document.getElementById("ticker-" + id).value;
          await api("/courts/" + id + "/match/ticker", { text });
        } else if (t.dataset.streamStart) {
          const id = t.dataset.streamStart;
          const titleInput = document.getElementById("yt-" + id);
          const title = titleInput ? titleInput.value.trim() : "";
          const sel = document.querySelector('input[name="ov-' + id + '"]:checked');
          const overlayMode = sel ? sel.value : undefined;
          // Server creates the YouTube broadcast (or falls back) and returns
          // the live snapshot in one call.
          await api("/courts/" + id + "/streaming/start", {
            title: title || undefined,
            overlayMode,
          });
        } else if (t.dataset.streamStop) {
          await api("/courts/" + t.dataset.streamStop + "/streaming/stop", {});
        } else if (t.dataset.suggest) {
          const id = t.dataset.suggest;
          const { title } = await api("/courts/" + id + "/streaming/suggest-title");
          const input = document.getElementById("yt-" + id);
          if (input) input.value = title;
        } else if (t.dataset.streamReset) {
          await api("/courts/" + t.dataset.streamReset + "/streaming/reset", {});
        }
      });

      socket.on("connect", () => {
        document.getElementById("conn").textContent = "connected";
      });
      socket.on("disconnect", () => {
        document.getElementById("conn").textContent = "disconnected";
      });
      socket.on("court:update", (snap) => {
        state.set(snap.courtId, snap);
        renderCourt(snap.courtId);
      });
      socket.on("streaming:update", (snap) => {
        streaming.set(snap.courtId, snap);
        renderStreaming(snap.courtId);
      });

      loadCourts();
    </script>
  </body>
</html>
