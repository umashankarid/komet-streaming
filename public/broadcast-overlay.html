<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Komet Broadcast Overlay</title>
    <style>
      /*
       * Broadcast overlay for burn-in compositing. Rendered headless at
       * 1920x1080 with a transparent background so FFmpeg can overlay it onto
       * the phone video. Layout:
       *   - Top-left: scoreboard (players, score, games, court/category).
       *   - Bottom: scrolling sponsor/tournament ticker.
       *
       * Query params:
       *   court=N        which court to show (default 1)
       *   mode=score|match|full|none   how much to show
       */
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        /* Chroma-key background: FFmpeg colorkeys this exact green out so only
         * the scoreboard/ticker composite over the video. Use a pure green not
         * present in the UI. */
        background: #00ff00;
        overflow: hidden;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #fff;
      }

      /* --- Top-left scoreboard --- */
      .scoreboard {
        position: absolute;
        top: 40px;
        left: 40px;
        min-width: 460px;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.4s ease;
      }
      .scoreboard.show { opacity: 1; }
      .sb-header {
        background: rgba(0, 0, 0, 0.7);
        padding: 8px 18px;
        font-size: 18px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: #cfe0f2;
      }
      .sb-banner {
        background: #ffd200;
        color: #06210f;
        padding: 6px 18px;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 2px;
        text-transform: uppercase;
        display: none;
      }
      .sb-banner.show { display: block; }
      .sb-row {
        display: grid;
        grid-template-columns: 22px 1fr auto auto auto;
        align-items: center;
        background: rgba(11, 22, 40, 0.94);
      }
      .sb-row.home { border-left: 8px solid #ffd200; }
      .sb-row.away {
        border-left: 8px solid #00b3ff;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
      }
      /* Server indicator: a shuttle dot, shown only for the serving side. */
      .sb-serve {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-left: 8px;
        background: transparent;
      }
      .sb-serve.on {
        background: #37d67a;
        box-shadow: 0 0 8px #37d67a;
      }
      /* Per-game (sets) scores, e.g. 21 18 11. */
      .sb-sets {
        display: flex;
        gap: 10px;
        padding: 0 14px;
        font-size: 22px;
        font-variant-numeric: tabular-nums;
        color: #cfe0f2;
      }
      .sb-sets .g { min-width: 22px; text-align: center; }
      .sb-sets .g.done { color: #9fb3c8; }
      .sb-sets .g.cur { color: #fff; font-weight: 700; }
      .sb-name {
        padding: 14px 20px;
        font-size: 30px;
        font-weight: 600;
        white-space: nowrap;
      }
      .sb-games {
        padding: 14px 18px;
        font-size: 26px;
        font-variant-numeric: tabular-nums;
        color: #ffd200;
        background: rgba(0, 0, 0, 0.28);
      }
      .sb-points {
        padding: 14px 26px;
        font-size: 38px;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        background: rgba(255, 255, 255, 0.10);
        min-width: 42px;
        text-align: center;
      }
      .sb-points.winner { outline: 3px solid #37d67a; }

      /* --- Bottom scrolling ticker --- */
      .ticker {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 64px;
        background: rgba(11, 22, 40, 0.92);
        border-top: 3px solid #ffd200;
        display: none;
        align-items: center;
        overflow: hidden;
        white-space: nowrap;
      }
      .ticker.show { display: flex; }
      .ticker-track {
        display: inline-block;
        padding-left: 100%;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 1px;
        animation: scroll-left 30s linear infinite;
      }
      .ticker-track .sep { color: #ffd200; padding: 0 28px; }
      @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
      }
    </style>
  </head>
  <body>
    <div id="board" class="scoreboard">
      <div class="sb-banner" id="banner"></div>
      <div class="sb-header" id="court-label">Court</div>
      <div class="sb-row home">
        <span class="sb-serve" id="home-serve"></span>
        <div class="sb-name" id="home-name">—</div>
        <div class="sb-sets" id="home-sets"></div>
        <div class="sb-games" id="home-games">0</div>
        <div class="sb-points" id="home-points">0</div>
      </div>
      <div class="sb-row away">
        <span class="sb-serve" id="away-serve"></span>
        <div class="sb-name" id="away-name">—</div>
        <div class="sb-sets" id="away-sets"></div>
        <div class="sb-games" id="away-games">0</div>
        <div class="sb-points" id="away-points">0</div>
      </div>
    </div>

    <div id="ticker" class="ticker">
      <div class="ticker-track" id="ticker-track"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const courtId = Number(params.get("court")) || 1;
      // mode: none | match | score | full
      const mode = params.get("mode") || "score";
      const $ = (id) => document.getElementById(id);
      const teamName = (t) =>
        (t?.players || []).map((p) => p.name).join(" / ") || "—";

      // What each mode shows:
      //  none  -> nothing (clean video)
      //  match -> scoreboard players/court, no live points
      //  score -> scoreboard with live points
      //  full  -> score + bottom sponsor/tournament ticker
      const showScoreboard = mode === "match" || mode === "score" || mode === "full";
      const showPoints = mode === "score" || mode === "full";
      const showTicker = mode === "full";

      // Server tracking: whoever scored the most recent point serves next.
      // Unknown (no dot) until the first point of the match.
      let lastPts = { home: 0, away: 0 };
      let server = null; // "home" | "away" | null

      function updateServer(cur) {
        if (!cur) return;
        const h = cur.home || 0;
        const a = cur.away || 0;
        // On a fresh game (both 0) keep prior server; only change when a side's
        // points increase.
        if (h > lastPts.home && h + a > 0) server = "home";
        else if (a > lastPts.away && h + a > 0) server = "away";
        // Reset the "last point" baseline; if the whole game reset to 0-0 mid
        // match (next game), keep the server from the last point scored.
        lastPts = { home: h, away: a };
      }

      // Render per-game columns: finished games + the current game.
      function renderSets(side, snap) {
        const el = $(side + "-sets");
        if (!showPoints) { el.innerHTML = ""; return; }
        const cells = [];
        (snap.games || []).forEach((g) => {
          cells.push('<span class="g done">' + (g[side] ?? 0) + "</span>");
        });
        // Current game (only if match not finished, else it's already in games).
        if (snap.status !== "finished") {
          cells.push('<span class="g cur">' + (snap.currentGame[side] ?? 0) + "</span>");
        }
        el.innerHTML = cells.join("");
      }

      function render(snap) {
        const board = $("board");
        if (!snap || !showScoreboard) {
          board.classList.remove("show");
        } else {
          updateServer(snap.currentGame);
          $("court-label").textContent =
            (snap.courtName || "Court " + snap.courtId) +
            " · " + snap.status.toUpperCase();
          const bannerEl = $("banner");
          if (snap.banner) {
            bannerEl.textContent = snap.banner;
            bannerEl.classList.add("show");
          } else {
            bannerEl.classList.remove("show");
          }
          $("home-name").textContent = teamName(snap.home);
          $("away-name").textContent = teamName(snap.away);
          $("home-games").textContent = snap.gamesWon.home;
          $("away-games").textContent = snap.gamesWon.away;
          renderSets("home", snap);
          renderSets("away", snap);
          // Server dot (only meaningful when points are shown and known).
          $("home-serve").classList.toggle("on", showPoints && server === "home");
          $("away-serve").classList.toggle("on", showPoints && server === "away");
          // In "match" mode we hide live points (show dashes).
          $("home-points").textContent = showPoints ? snap.currentGame.home : "";
          $("away-points").textContent = showPoints ? snap.currentGame.away : "";
          $("home-points").classList.toggle("winner", snap.matchWinner === "home");
          $("away-points").classList.toggle("winner", snap.matchWinner === "away");
          board.classList.add("show");
        }

        // Ticker: tournament banner + sponsor/ticker text, repeated.
        if (showTicker) {
          const bits = [];
          if (snap && snap.banner) bits.push(snap.banner);
          if (snap && snap.tickerText) bits.push(snap.tickerText);
          if (snap && snap.courtName) bits.push(snap.courtName);
          const text = bits.length ? bits.join("  •  ") : "BMK KOMET";
          // Duplicate so the scroll loop is seamless.
          $("ticker-track").innerHTML =
            '<span>' + text + '</span><span class="sep">•</span><span>' + text + "</span>";
          $("ticker").classList.add("show");
        } else {
          $("ticker").classList.remove("show");
        }
      }

      fetch("/api/courts/" + courtId + "/match")
        .then((r) => (r.ok ? r.json() : null))
        .then(render)
        .catch(() => render(null));

      const socket = io();
      socket.on("connect", () => socket.emit("join-court", courtId));
      socket.on("court:update", render);
      socket.on("court:cleared", () => render(null));
    </script>
  </body>
</html>
