<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Komet — Sign in</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b1628;
        color: #e8eef6;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
      }
      .card {
        background: #13233d;
        border: 1px solid #21344f;
        border-radius: 12px;
        padding: 32px;
        width: 320px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
        letter-spacing: 1px;
      }
      p.sub {
        margin: 0 0 20px;
        color: #9fb3c8;
        font-size: 13px;
      }
      label {
        display: block;
        font-size: 13px;
        margin: 12px 0 4px;
        color: #9fb3c8;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #0d1b31;
        border: 1px solid #21344f;
        color: #fff;
        border-radius: 6px;
        padding: 10px;
        font-size: 15px;
      }
      button {
        margin-top: 20px;
        width: 100%;
        background: #37d67a;
        color: #06210f;
        border: none;
        border-radius: 6px;
        padding: 11px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      .error {
        margin-top: 14px;
        color: #ff6b6b;
        font-size: 13px;
        display: none;
      }
    </style>
  </head>
  <body>
    <form class="card" method="POST" action="/login">
      <h1>BMK KOMET</h1>
      <p class="sub">Streaming control — sign in</p>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      />
      <button type="submit">Sign in</button>
      <div class="error" id="error">Invalid username or password.</div>
    </form>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("error").style.display = "block";
      }
    </script>
  </body>
</html>
